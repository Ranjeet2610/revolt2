name: Deploy to AWS EC2

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  EC2_HOST: ${{ secrets.EC2_HOST }}
  EC2_USER: ${{ secrets.EC2_USER }}
  EC2_KEY: ${{ secrets.EC2_KEY }}
  EC2_PATH: ${{ secrets.EC2_PATH }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci --production
      
    - name: Create deployment package
      run: |
        tar -czf deploy.tar.gz \
          --exclude=node_modules \
          --exclude=.git \
          --exclude=.github \
          --exclude=*.log \
          --exclude=server-* \
          .
          
    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ env.EC2_HOST }}
        username: ${{ env.EC2_USER }}
        key: ${{ env.EC2_KEY }}
        script: |
          # Create backup
          if [ -d "${{ env.EC2_PATH }}" ]; then
            sudo cp -r ${{ env.EC2_PATH }} ${{ env.EC2_PATH }}.backup.$(date +%Y%m%d_%H%M%S)
          fi
          
          # Stop services
          sudo systemctl stop revolt-bot || true
          
          # Update application
          cd ${{ env.EC2_PATH }}
          sudo rm -rf *
          sudo tar -xzf /tmp/deploy.tar.gz
          sudo chown -R revoltbot:revoltbot ${{ env.EC2_PATH }}
          
          # Install dependencies
          sudo -u revoltbot npm install --production
          
          # Start services
          sudo systemctl start revolt-bot
          sudo systemctl reload nginx
          
          # Cleanup
          rm -f /tmp/deploy.tar.gz
          
    - name: Upload deployment package
      uses: appleboy/scp-action@v0.1.4
      with:
        host: ${{ env.EC2_HOST }}
        username: ${{ env.EC2_USER }}
        key: ${{ env.EC2_KEY }}
        source: "deploy.tar.gz"
        target: "/tmp/"
        
    - name: Verify deployment
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ env.EC2_HOST }}
        username: ${{ env.EC2_USER }}
        key: ${{ env.EC2_KEY }}
        script: |
          # Wait for service to start
          sleep 10
          
          # Check service status
          sudo systemctl status revolt-bot --no-pager
          
          # Check if ports are listening
          netstat -tlnp | grep -E ":(80|443|1024|49623)" || true
          
          # Test HTTP response
          curl -f http://13.232.150.98:1024 || exit 1
